<!doctype html>
<html lang="pt-br" class="light">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DevLinks</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="container">
      <div id="profile">
        <img src="https://media.licdn.com/dms/image/v2/D4D03AQF9EJLqIHKenQ/profile-displayphoto-scale_400_400/B4DZ3VVYipG4Ag-/0/1777400647211?e=1779321600&v=beta&t=W8HfdNy1rAEVXsU2-Wms6KofG3KlLvIJt6-ywwCQC9s" alt="Avatar perfil" />
        <p>@kaua.mcv</p>
      </div>

      <div id="switch" onclick="toggleMode()">
        <button></button>
        <span></span>
      </div>

      <ul>
        <li>
          <a href="https://linkedin.com/in/kaua-marcelo" target="_blank">Me acompanhe no LinkedIn</a>
        </li>
        <li>
          <a href="https://instagram.com/kaua.mcv" target="_blank">Me acompanhe no Instagram</a>
        </li>
        <li>
          <a href="https://github.com/Kaua-Marcelo" target="_blank">Ver meu protifólio</a>
        </li>
      </ul>
      <div id="social-links">
        <a href="https://github.com/Kaua-Marcelo" target="_blank">
          <ion-icon name="logo-github"></ion-icon>
        </a>
        <a href="https://instagram.com/kaua.mcv" target="_blank">
          <ion-icon name="logo-instagram"></ion-icon>
        </a>
        <a
          href="https://linkedin.com/in/kaua-marcelo"
          target="_blank"
        >
          <ion-icon name="logo-linkedin"></ion-icon>
        </a>
      </div>
      <footer>
        Feito por <a href="https://instagram.com/kaua.mcv" target="_blank">Kauã</a>
      </footer>
    </div>

    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
    <script
      nomodule
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"
    ></script>

    <script src="./script.js"></script>

</html>
